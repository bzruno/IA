keywords:
  - artificial intelligence
  - generative AI
  - machine learning
  - deep learning
  - large language model
  - LLM
  - OpenAI
  - Anthropic
  - Gemini
  - Claude
  - ChatGPT
  - DeepMind
  - Mistral
  - xAI
  - AI agents
  - AI regulation
  - AI chips

deduplication:
  title_similarity_threshold: 92

# Download do texto integral de cada notícia. Páginas fechadas por paywall ou por
# muro de cookies ficam abaixo de min_chars e entram no relatório só com os
# metadados — nada aqui tenta contornar esse tipo de bloqueio.
full_text:
  enabled: true
  max_workers: 8
  timeout_seconds: 20
  min_chars: 400
  max_chars: 20000
